apiVersion: apps/v1
kind: Deployment
metadata:
  name: grade-calc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grade-calc
  template:
    metadata:
      labels:
        app: grade-calc
    spec:
      containers:
      - name: grade-calc
        image: DOCKERHUB_IMAGE_PLACEHOLDER
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: grade-calc-service
spec:
  type: NodePort
  selector:
    app: grade-calc
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
      nodePort: 30002